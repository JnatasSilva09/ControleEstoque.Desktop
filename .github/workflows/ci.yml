name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest   # o projeto é net8.0-windows (WinForms)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release